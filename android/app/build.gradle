plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "dev.flutter.flutter-gradle-plugin"
}

def releaseSigningPropertiesFile = rootProject.file('key.properties')
def releaseSigningProperties = new Properties()
if (releaseSigningPropertiesFile.isFile()) {
    releaseSigningPropertiesFile.withInputStream { stream ->
        releaseSigningProperties.load(stream)
    }
}

gradle.taskGraph.whenReady { taskGraph ->
    if (taskGraph.allTasks.any { task -> task.name.toLowerCase(Locale.ROOT).contains('release') } &&
        !releaseSigningPropertiesFile.isFile()) {
        throw new GradleException(
            'Release signing is not configured. Create the ignored android/key.properties file.'
        )
    }
}

android {
    namespace = "cn.sjtu.jiaotong_course"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = "28.2.13676358"

    defaultConfig {
        applicationId = "cn.sjtu.jiaotong_course"
        minSdkVersion = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    if (releaseSigningPropertiesFile.isFile()) {
        signingConfigs {
            release {
                keyAlias = releaseSigningProperties['keyAlias']
                keyPassword = releaseSigningProperties['keyPassword']
                storeFile = file(releaseSigningProperties['storeFile'])
                storePassword = releaseSigningProperties['storePassword']
            }
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    buildTypes {
        release {
            if (releaseSigningPropertiesFile.isFile()) {
                signingConfig = signingConfigs.release
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
}

flutter {
    source = "../.."
}
